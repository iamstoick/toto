name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt + clippy + test gate
        run: ./scripts/check.sh
  release-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: release stack + timings gates
        run: cargo test --release -p toto-jit --test stack_jit --test timings -- --nocapture
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build bench drivers
        run: cargo build -p toto-cli -p toto-jit
      - name: benchmark suite with regression flagging
        run: ./scripts/bench.sh --runs 3 --baseline bench/baseline.txt
  # Enterprise Wave 0, Stage 1: Tier-1 feasibility probes. Scoped on
  # purpose (build + Tier-1 conformance + corpus gate + one concurrent
  # program) — promotion to the full check.sh per platform happens only
  # on a SUPPORTED verdict with evidence (see the Wave 0 report).
  tier1-probe:
    strategy:
      fail-fast: false
      matrix:
        # Windows is DEFERRED WITH EVIDENCE (Wave 0 report: POSIX FFI
        # surface), not Tier-1. Its probe keeps running as evidence but
        # does not fail the run; flip experimental to false when the
        # POSIX-compat decision lands and the corpus goes green there.
        include:
          - os: ubuntu-24.04-arm
            experimental: false
          - os: macos-latest
            experimental: false
          - os: windows-latest
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build workspace
        run: cargo build --workspace --exclude ffi-smoke-test
      # TEMPORARY macOS net-op isolation (revert after root cause):
      # runs each TCP op separately with timeouts so a hang names
      # the failing op instead of wedging the corpus gate.
      - name: isolate macOS net op (temporary)
        if: matrix.os == 'macos-latest'
        run: |
          cat > /tmp/op_listen.gzv <<'EOF'
          import "gzv.std/net.gzv";
          fn run() -> Result<string, string> {
              let l = net_tcp_listen(48221)?;
              net_close(l)?;
              return Ok("LISTEN-OK");
          }
          fn main() -> int {
              println(run());
              return 0;
          }
          EOF
          cat > /tmp/op_refused.gzv <<'EOF'
          import "gzv.std/net.gzv";
          fn main() -> int {
              let r = net_tcp_connect("127.0.0.1", 48222);
              println(r);
              return 0;
          }
          EOF
          cat > /tmp/op_echo.gzv <<'EOF'
          import "gzv.std/net.gzv";
          fn tcp_serve_inner(listener: int) -> Result<int, string> {
              let conn = net_accept(listener)?;
              let data = net_recv(conn, 2)?;
              let n = net_send_all(conn, data)?;
              net_close(conn)?;
              net_close(listener)?;
              return Ok(n);
          }
          fn tcp_serve(listener: int, out: chan<Result<int, string>>) -> int {
              out <- tcp_serve_inner(listener);
              return 0;
          }
          fn run() -> Result<string, string> {
              let done = chan<Result<int, string>>(1);
              let listener = net_tcp_listen(48223)?;
              go {
                  tcp_serve(listener, done);
              }
              let conn = net_tcp_connect("127.0.0.1", 48223)?;
              let sent = net_send_all(conn, [72, 105])?;
              let resp = net_recv(conn, 2)?;
              net_close(conn)?;
              let n = <-done;
              return Ok("done");
          }
          fn main() -> int {
              println(run());
              return 0;
          }
          EOF
          for t in op_listen op_refused op_echo; do
            echo "=== $t ===";
            ./target/debug/toto run /tmp/$t.gzv > /tmp/$t.out 2>&1 &
            PID=$!;
            sleep 20;
            if kill -0 $PID 2>/dev/null; then
              echo "TIMEOUT $t (alive after 20s); killing";
              kill -9 $PID || true;
            else
              echo "DONE $t:"; cat /tmp/$t.out || true;
            fi;
          done
      - name: Tier-1 conformance (frozen ADR-008, no codegen needed)
        run: cargo test -p toto-compiler --test mir_conform
      - name: corpus gate
        # TEMPORARY macOS-stall diagnosis (revert after root cause).
        run: cargo test -p toto-cli --test corpus -- --nocapture
      - name: one concurrent program end to end
        run: |
          out=$(cargo run -q -p toto-cli -- run tests/corpus/concurrent/conc01_pingpong.gzv)
          [ "$out" = "42" ] || { echo "pingpong mismatch: [$out]"; exit 1; }
