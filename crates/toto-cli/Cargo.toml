[package]
name = "toto-cli"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[[bin]]
name = "toto"
path = "src/main.rs"

[dependencies]
toto-compiler = { path = "../toto-compiler" }
toto-jit = { path = "../toto-jit" }
toto-runtime = { path = "../toto-runtime" }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
